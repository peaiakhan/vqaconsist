[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peaiakhan-vqaconsist"
version = "0.1.0"
description = "把答案里的断言与图中可辨信息比对，标出无依据的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "peaiakhan" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://peaiakhan.github.io"
Repository = "https://github.com/peaiakhan/vqaconsist"
Issues = "https://github.com/peaiakhan/vqaconsist/issues"

[project.scripts]
vqaconsist = "vqaconsist:main"

[tool.setuptools]
py-modules = ["vqaconsist"]
